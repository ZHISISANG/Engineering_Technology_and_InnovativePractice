[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "expo-ticket-trace"
version = "0.2.0"
description = "展商咨询工单的版本可追溯只读试点工具：只读、只出草稿、可审计"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "expo-ticket-trace contributors" }]
keywords = ["exhibition", "ticket", "traceability", "read-only", "audit", "pilot"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Office/Business",
]
# 运行时零第三方依赖：审计类工具不引入供应链面。
dependencies = []

[project.optional-dependencies]
# Web 层（阶段 2）是可选安装：核心 CLI、审计与示例都只用标准库。
web = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
expo-trace = "expo_trace.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# Web 层的静态资源（chat.js / style.css）不是 Python 包，需显式声明。
[tool.setuptools.package-data]
"expo_trace.web" = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
